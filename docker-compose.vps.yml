# On the shared VPS: also join the Chord stack's network, so CHORD_API=http://api:3001 reaches Chord's API without leaving the box.
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d --build
services:
  chordmonad:
    networks: [default, chord]
networks:
  chord:
    external: true
    name: nullterminal_nullnet
